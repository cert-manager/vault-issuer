# +docs:section=Global
global:
  rbac:
    # Create the ClusterRole, ClusterRoleBinding, Roles and RoleBindings that
    # vault-issuer needs.
    create: true

# The number of replicas of vault-issuer to run.
#
# Leader election is enabled, so only one replica reconciles at a time; the
# others stand by.
#
# For example:
#  Use integer to set a fixed number of replicas
#   replicaCount: 2
#
#  Use null, if you want to omit the replicas field and use the Kubernetes default value.
#   replicaCount: null
#
#  Use a string if you want to insert a variable for post-processing of the rendered template.
#   replicaCount: ${REPLICAS_OVERRIDE:=3}
#
# +docs:type=number,string,null
replicaCount: 1

# The number of old ReplicaSets to retain to allow rollback.
# If set to 0, no old ReplicaSets are retained.
# +docs:type=number,null
revisionHistoryLimit: 10

nameOverride: ""

# The namespace to install vault-issuer into.
# If not set, the namespace of the release is used.
# This is helpful when installing vault-issuer as a chart dependency (sub chart).
namespace: ""

# For Private docker registries, authentication is needed. Registry secrets are
# applied to the service account.
imagePullSecrets: []

# The container registry used for vault-issuer images by default.
# This can include path prefixes (e.g. "artifactory.example.com/docker").
# +docs:property
imageRegistry: quay.io

# The repository namespace used for vault-issuer images by default.
# Examples:
# - jetstack
# - cert-manager
# +docs:property
imageNamespace: jetstack

image:
  # Full repository override (takes precedence over `imageRegistry`,
  # `imageNamespace`, and `image.name`).
  # Example: quay.io/jetstack/vault-issuer
  # +docs:property
  repository: ""

  # The image name for vault-issuer.
  # This is used (together with `imageRegistry` and `imageNamespace`) to
  # construct the full image reference.
  # +docs:property
  name: vault-issuer

  # Override the image tag to deploy by setting this variable.
  # If no value is set, the chart's appVersion is used.
  # +docs:property
  # tag: vX.Y.Z

  # Target image digest. Override any tag, if set.
  # For example:
  #   digest: sha256:0e072dddd1f7f8fc8909a2ca6f65e76c5f0d2fcfb8be47935ae3457e8bbceb20
  # +docs:property
  # digest: sha256:...

  # Kubernetes imagePullPolicy on Deployment.
  pullPolicy: IfNotPresent

# Automounting API credentials for the vault-issuer pod.
# Required: the controller talks to the Kubernetes API.
# +docs:property
automountServiceAccountToken: true

serviceAccount:
  # Specifies whether a service account should be created.
  create: true

  # The name of the service account to use.
  # If not set and create is true, a name is generated using the name template.
  # +docs:property
  # name: ""

  # Automount API credentials for a Service Account.
  # +docs:property
  automountServiceAccountToken: true

  # Annotations to add to the ServiceAccount, for example to bind a cloud
  # identity to it.
  annotations: {}

# Additional volumes to add to the vault-issuer pod.
volumes: []

# Additional volume mounts to add to the vault-issuer container.
volumeMounts: []

# Kubernetes pod resources for vault-issuer.
#
# For example:
#  resources:
#    limits:
#      cpu: 100m
#      memory: 128Mi
#    requests:
#      cpu: 100m
#      memory: 128Mi
resources: {}

# Security Context to be set on the vault-issuer Pod. For more information,
# see [Configure a Security Context for a Pod or Container](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/).
podSecurityContext: {}

# Configure the priority class of the pod. For more information, see
# [PriorityClass](https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/#priorityclass).
priorityClassName: ""

# Configure the nodeSelector; defaults to any Linux node (vault-issuer doesn't
# support Windows nodes)
# +docs:property
nodeSelector:
  kubernetes.io/os: linux

# Kubernetes Affinity. For more information, see [Affinity v1 core](https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.27/#affinity-v1-core).
# For example:
#   affinity:
#     nodeAffinity:
#      requiredDuringSchedulingIgnoredDuringExecution:
#        nodeSelectorTerms:
#        - matchExpressions:
#          - key: foo.bar.com/role
#            operator: In
#            values:
#            - master
affinity: {}

# List of Kubernetes Tolerations, if required. For more information, see
# [Toleration v1 core](https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.27/#toleration-v1-core).
# For example:
#   tolerations:
#   - key: foo.bar.com/role
#     operator: Equal
#     value: master
#     effect: NoSchedule
tolerations: []

# List of Kubernetes TopologySpreadConstraints. For more information, see
# [TopologySpreadConstraint v1 core](https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.27/#topologyspreadconstraint-v1-core).
# For example:
#   topologySpreadConstraints:
#   - maxSkew: 2
#     topologyKey: topology.kubernetes.io/zone
#     whenUnsatisfiable: ScheduleAnyway
#     labelSelector:
#       matchLabels:
#         app.kubernetes.io/name: vault-issuer
topologySpreadConstraints: []

app:
  # The format of vault-issuer logging. Accepted values are text or json.
  logFormat: text

  # The verbosity of vault-issuer logging. This takes a value from 1-5, with
  # the higher value being more verbose.
  logLevel: 1

  issuer:
    # The namespace Secrets referenced by a ClusterIssuer are read from.
    #
    # Namespaced Issuers always read their Secrets from their own namespace;
    # this setting only applies to cluster-scoped Issuers, which have no
    # namespace of their own. Defaults to the namespace vault-issuer is
    # installed into.
    # +docs:property
    clusterResourceNamespace: ""

    # Allow namespaced Issuers to authenticate with credentials drawn from the
    # controller's environment, such as instance metadata or IRSA, rather than
    # from the Issuer's spec.
    #
    # This is off by default: anyone who can create an Issuer in any namespace
    # could otherwise borrow the controller's cloud identity.
    ambientCredentials: false

    # Allow ClusterIssuers to authenticate with credentials drawn from the
    # controller's environment. ClusterIssuers are cluster-scoped and
    # therefore managed by cluster administrators, so this is on by default.
    clusterAmbientCredentials: true

    # How long a CertificateRequest is retried after a transient signing
    # error, measured from when the request was created. Once exceeded, the
    # request fails and cert-manager creates a new one.
    maxRetryDuration: 2m

  leaderElection:
    # Whether to enable leader election for vault-issuer.
    enabled: true

    # The duration that non-leader candidates will wait to force acquire
    # leadership.
    # The default should be sufficient in a healthy cluster but can be
    # slightly increased to prevent vault-issuer from restart-looping when the
    # API server is overloaded.
    leaseDuration: 15s

    # The interval between attempts by the acting leader to renew a leadership
    # slot before it stops leading.
    # This MUST be less than or equal to the lease duration.
    # The default should be sufficient in a healthy cluster but can be
    # slightly increased to prevent vault-issuer from restart-looping when the
    # API server is overloaded.
    renewDeadline: 10s

  readinessProbe:
    # The container port on which to expose the vault-issuer HTTP readiness
    # probe using the default network interface.
    port: 6060
    # The path on which to expose the vault-issuer HTTP readiness probe using
    # the default network interface.
    path: "/readyz"

  # Security Context to be set on the vault-issuer app container. For more
  # information, see [Configure a Security Context for a Pod or Container](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/).
  # +docs:property
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # Pod labels to add to vault-issuer pods.
  podLabels: {}

  # Pod annotations to add to vault-issuer pods.
  podAnnotations: {}

  # Extra command line arguments passed to vault-issuer.
  extraArgs: []

  # +docs:section=Metrics

  metrics:
    # The port for exposing Prometheus metrics on 0.0.0.0 on path '/metrics'.
    port: 9402
    # The service to expose metrics endpoint.
    service:
      # Create a Service resource to expose the metrics endpoint.
      enabled: true
      # The Service type to expose metrics.
      type: ClusterIP
      # Set the ip family policy to configure dual-stack see [Configure dual-stack](https://kubernetes.io/docs/concepts/services-networking/dual-stack/#services)
      ipFamilyPolicy: ""
      # Sets the families that should be supported and the order in which they
      # should be applied to ClusterIP as well. Can be IPv4 and/or IPv6.
      ipFamilies: []
      # The ServiceMonitor resource for this Service.
      servicemonitor:
        # Create a Prometheus ServiceMonitor for vault-issuer.
        enabled: false
        # Sets the value of the "prometheus" label on the ServiceMonitor.
        # This is used so that separate Prometheus instances can select
        # different ServiceMonitors using labels.
        prometheusInstance: default
        # The interval to scrape the metrics.
        interval: 10s
        # The timeout for a metrics scrape.
        scrapeTimeout: 5s
        # Additional labels to add to the ServiceMonitor.
        labels: {}
        # EndpointAdditionalProperties allows setting additional properties on
        # the endpoint such as relabelings, metricRelabelings etc.
        #
        # For example:
        #  endpointAdditionalProperties:
        #   relabelings:
        #   - action: replace
        #     sourceLabels:
        #     - __meta_kubernetes_pod_node_name
        #     targetLabel: instance
        #
        # +docs:property
        endpointAdditionalProperties: {}

podDisruptionBudget:
  # Enable or disable the PodDisruptionBudget resource.
  #
  # This prevents downtime during voluntary disruptions such as during a Node
  # upgrade. For example, the PodDisruptionBudget will block `kubectl drain`
  # if it is used on the Node where the only remaining vault-issuer
  # Pod is currently running.
  enabled: false

  # This configures the minimum available pods for disruptions. It can either
  # be set to an integer (e.g. 1) or a percentage value (e.g. 25%).
  # It cannot be used if `maxUnavailable` is set.
  # +docs:type=unknown
  # +docs:property
  # minAvailable: 1

  # This configures the maximum unavailable pods for disruptions. It can
  # either be set to an integer (e.g. 1) or a percentage value (e.g. 25%).
  # It cannot be used if `minAvailable` is set.
  # +docs:type=unknown
  # +docs:property
  # maxUnavailable: 1

# Labels to apply to all resources
commonLabels: {}

# Annotations to apply to all resources
commonAnnotations: {}

# Extra manifests to be deployed. This is useful for deploying additional
# resources that are not part of the chart.
# For example:
# extraObjects:
#  - apiVersion: cilium.io/v2
#    kind: CiliumNetworkPolicy
#    metadata:
#      name: vault-issuer
#      namespace: cert-manager
#    spec:
#      endpointSelector:
#        matchLabels:
#          io.cilium.k8s.policy.serviceaccount: vault-issuer
#      egress:
#        - toEntities:
#            - kube-apiserver
extraObjects: []

# Field to optionally disable installation of the chart when wrapping it as a
# dependency in another chart.
# This matches the helm best practices:
# https://helm.sh/docs/chart_best_practices/dependencies/#conditions-and-tags
# +docs:hidden
enabled: true
